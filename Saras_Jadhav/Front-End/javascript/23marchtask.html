        // 8. Check whether a number is prime or not.

        let Num = 7;
        let i = 2 ;
        flag = 1;

        if ( Num <= 1){
            flag = 0;
        }else{
            while( Num > i){
                if(Num % i == 0){
                    flag = 0;
                    break;
                }
                i++;
            }
        }
        if(flag == 1){
            console.log("number is prime");
