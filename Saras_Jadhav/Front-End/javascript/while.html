<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
  <script>
     let i = 1;
       let even = " ";
       let odd = " ";
       
       while(i<= 10){
        if(i % 2 == 0 ){
           even +=  "" +i +"\n";
          }
          else if (i % 2 !== 0) {
            odd +=  "" +i+"\n";
          }
        i++;
       }
       console.log("even number:\n",even);
       console.log("odd number:\n", odd);

  </script>  
</body>
</html>
