<body>

    <script>
         // Arithmactic opretor

         let x=5;
         let y=2;
         let z=x+y;
         console.log(z);

         // Assigment opretor

         let a= 10;
         a+=5;
         console.log(a);

         // comparison opretor

         let d=10;
         console.log(d>5);

         // logical opretor

         let e=10;
         let f=20;
         let g=(e>5 && f>24);
         console.log(g);

          let h=10;
         let l=20;
         let o=(h>5 || l>24);
         console.log(o);

    </script>
