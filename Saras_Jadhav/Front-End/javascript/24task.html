          let square1 = square(5);


        // 2.	Create an arrow function to check if a number is even or odd.........................

        const number = (num) =>{
         if(num % 2 == 0){
            console.log("number is even");                  
        }else{
            console.log("number is odd");
        }
        }

        console.log(number(23));


        // 3.Create an arrow function to find the maximum of two numbers.............................

        const max = (num1 , num2) => {
            if(num1 > num2){
                console.log("number 1 is maximum:",num1);
            }else{
                console.log("number 2 is maximum:",num2);
            }
        }
        console.log(max(20,12));


        // 4. Create a function to print all even numbers between 1 to 50............................
          
        function even (m){
            console.log("even number 1 to 50")
            for(let i = 1; i <= m; i++){
                if(i % 2 == 0){
                    console.log(i);
                }
            }
        }
        console.log(even(50));


        // 5.	Write a function to find the sum of numbers from 1 to N...........................

        function addition (n){
            let add = 0;
           for(let j = 1; j <= n; j++){
              add = add + j;
           }
             return add;
        }
        let add1 = addition(5);
        console.log("addition of:",add1);
