<!DOCTYPE html>
<html>
<head>
<title>web page</title>
<style>

.container{
border:2px solid black;
border-radius:10px;
height:570px;
width:400px;
margin-left:400px;
margin-top:10px;
background-color:orange;
}

h2{
margin-left:70px;
margin-top:30px;
color:black;
}

.style {
margin-left:90px;
height:30px;
width:200px;
border-radius:20px;
text-align:center;
}

button{
margin-left:180px;
margin-top:20px;
}

label{
margin-left:100px;
margin-top:10px;

}

.gender{
  margin-left:160px;
  }

.file{
margin-left:120px;
}

</style>
</head>
<body>
<div class="container">
<form action="" name="" method="post" autocomplete="off">
  <h2>student registration form</h2><hr><br>

  <input type="text" placeholder="Enter your name" class="style"><br><br>
  
  <input type="tel" placeholder="Enter your number" class="style"><br><br>

  <input type="text" placeholder="Enter your collage name" class="style"><br><br>  

  <input type="email" placeholder="Enter your email" class="style"><br><br>

  <input type="password" placeholder="password" class="style"><br><br>

  <input type="file" placeholder="file" class="file"><br><br>
  
  <label>Birth Date:</label>
  <input type="date"><br><br>

  <label>gender:-</label><br>
  <input type="radio" name="gender" class="gender">male<br>
  <input type="radio" name="gender" class="gender">female<br>

  
 

   <button>submit </button>

</form>
</div>
</body>
</html>
