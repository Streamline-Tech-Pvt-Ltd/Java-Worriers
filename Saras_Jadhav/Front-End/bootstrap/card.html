<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>
<body>
    <div class="container">
    <div class="card  ms-5 mt-5" style="width:300px">
        <img src="venue.png" class="card-img-top" alt="card image">
        <div class="card-body"></div>
        <h5 class="card-title">Hyundai Venue</h5>
        <h6 class="text-success">price:14,50,000</h6>
        <p class="card-text">The Hyundai Venue is a stylish compact SUV with advanced features, good mileage, and a comfortable interior.
             Perfect for city driving and long journeys.</p>
        <a href="#" class="btn btn-primary">Buy Now</a>
 
    </div>
    </div>
    
</body>
</html>
