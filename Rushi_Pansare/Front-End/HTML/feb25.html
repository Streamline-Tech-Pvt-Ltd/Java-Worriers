<html>
<head>
<title>Basic Form</title>
<style>
.container{
    margin: 100px auto;  
    padding: 30px;
    border: 5px solid black;
    width: 300px;
    border-radius: 10px;
    background-color: yellow;
    text-align: center;
}

input{
    height: 40px;
    border-radius: 10px;
    width: 250px;
    text-align: center;
    margin-bottom: 15px;
}

button{
    height: 35px;
    width: 80px;
    border-radius: 10px;
    background-color: skyblue;
    border: none;
    cursor: pointer;
}

h1{
    margin-bottom: 10px;
}
</style>
</head>

<body>

<div class="container">
<h1>Registration Form</h1>
<hr>

<form action="" method="post">
    <input type="text" placeholder="Enter Your Name"><br>
    <input type="number" placeholder="Enter Your Number"><br>
    <input type="email" placeholder="Enter Your Email"><br>
    <button>Submit</button>
</form>

</div>

</body>
</html>
