<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow function</title>
</head>
<body>
    <script>
        const evenOdd = (num) => {
            if(num%2 == 0){
                console.log("even number");

            }else{
                console.log("odd number");
            }
        }
        console.log(evenOdd(2));
    </script>
</body>
</html>
