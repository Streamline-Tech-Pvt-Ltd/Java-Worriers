<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial</title>
</head>

<body>
    <script>
        let num = 5;
        let i = 1;
        let fact = 1;

        while (i <= num) {
            fact = fact * i;
            i++;
        }

        console.log("Factorial is:", fact);
    </script>
</body>

</html>
