<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prime</title>
</head>

<body>
    <script>
        let n = 7;
        let prime = true;

        for (let i = 2; i < n; i++) {
            if (n % i == 0) {
                prime = false;
            }
        }

        if (n <= 1) {
            prime = false;
        }

        if (prime) {
            console.log("Prime");
        } else {
            console.log("Not Prime");
        }
    </script>
</body>

</html>
