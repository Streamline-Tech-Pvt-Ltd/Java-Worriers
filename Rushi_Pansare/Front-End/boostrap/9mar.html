<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

</head>

<body>
    <div class="container">
        <img src="me.jpg" class="rounded-circle " alt="Image" height="150px" width="150px">
    </div>
    <!--<div class="container">
    <img src="me.jpg" class="img-responsive" height="200" width="200">-->

    </div>
    <div class="iframe">
        <iframe class="embed-responsive-item" src="me.jpg">
        </iframe>
    </div>

    <div class="alert alert-success">
        <p>Display the Alert</p>
    </div>


    <div class="alert alert-info">
        <p>Display the sky blue</p>
    </div>

    <div class="alert alert-danger">
        <p>Display the red</p>
    </div>

    <div class="alert alert-primary">
        <p>Display the blue</p>
    </div>


    <div class="alert alert-secondary">
        <p>Display the grey</p>
    </div>

    <div class="alert alert-dark">
        <p>Display the dark grey</p>
    </div>

    <div class="alert alert-light">
        <p>Display the empty white</p>
    </div>

    <div class="alert alert-success">
        <p>sucess </p> <a href="#" class="alert-link">read this message</a>
    </div>

    <div class="alert alert-danger alert-dismissible">
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        <p> Sucess!this box contain sucessful or positive action</p>
    </div>

    <div class="container">
        <button type="button" class="btn">Basic</button>
        <button type="button" class="btn btn-primary">primary</button>
        <button type="button" class="btn btn-secondary">secondary</button>
        <button type="button" class="btn btn-dark">dark</button>
        <button type="button" class="btn btn-light">light</button>
        <button type="button" class="btn btn-danger">danger</button>
        <button type="button" class="btn btn-success">succses</button>

        <br><br>

        <div class="conatner">
            <a href="#" class="btn btn-success">link Button</a>
            <button type="button" class="btn btn-success">Button</button>
            <input type="button" class="btn btn-success" value="input button">
            <input type="submit" class="btn btn-primary" value="submit button">
            <input type="reset" class="btn btn-danger" value="reset button"><br><br>
            <hr>

            <!--hover type effect-->
            <button type="button" class="btn btn-outline-primary">primary</button><br><br>
            <button type="button" class="btn btn-outline-success">danger</button><br><br>
            <!--button size-->
            <button type="button" class="btn btn-primary btn-lg">largebutton</button><br><br>
            <button type="button" class="btn btn-danger btn-sm">small button</button>
        </div>
        <div class="d-grid gap-2"
            <button type="button" class="btn btn-outline-primary btn-block">full width button</button>
            <button type="button" class="btn btn-outline-primary btn-block">full width button</button>
            <button type="button" class="btn btn-outline-primary btn-block">full width button</button>
            <button type="button" class="btn btn-outline-primary btn-block">full width button</button>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
</body>

</html>
