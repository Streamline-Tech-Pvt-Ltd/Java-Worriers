<!-- Contact Section -->
<section id="contact" class="py-5 bg-light">

    <div class="container">

        <div class="text-center mb-5">
            <h2 class="fw-bold text-primary">Contact Me</h2>
            <p class="text-muted">
                Let's connect! Feel free to contact me for jobs, internships, or collaborations.
            </p>
        </div>

        <div class="row justify-content-center">

            <div class="col-lg-7 col-md-9">

                <div class="card shadow-lg border-0 rounded-4">

                    <div class="card-body p-4">

                        <h3 class="fw-bold text-primary mb-4 text-center">
                            Send Message
                        </h3>

                        <form>

                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg" placeholder="Your Name">
                            </div>

                            <div class="mb-3">
                                <input type="email" class="form-control form-control-lg" placeholder="Your Email">
                            </div>

                            <div class="mb-3">
                                <input type="text" class="form-control form-control-lg" placeholder="Subject">
                            </div>

                            <div class="mb-3">
                                <textarea class="form-control" rows="5" placeholder="Your Message"></textarea>
                            </div>

                            <button class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-send-fill"></i>
                                Send Message
                            </button>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>

</section>
