<?DOCTYPE html>
<html>
<head>
<title>Tables in html</title>
<style>
table,tr,td,th{
border:1px solid black;
padding-left:10px;
border-spacing:10px;
</style>
</head>
<body>
<table>
<caption>Student Info</caption>
<tr>
<th>Sr.no</th>
<th>Name</th>
<th>Class</th>
</tr>
<tr>
<td>1</td>
<td>Sujit</td>
<td>MCA</td>
</tr>
<tr>
<td>2</td>
<td>Sahil</td>
<td>MBA</td>
</tr>
<tr>
<td>3</td>
<td>Ashlesha</td>
<td>MCA</td>
</tr>
</table>
</body>
</html>
