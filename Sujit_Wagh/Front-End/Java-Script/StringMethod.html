<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const firstname="sujit";
        const lastname="wagh";
        // length
        let length=firstname.length;
        console.log(length);
        //concat
        let fullname=firstname.concat(" ",lastname);
        console.log(fullname);
        //charAt
        let char=firstname.charAt(2);
        console.log(char);
        //indexOf
        let index=firstname.indexOf("j");       
        console.log(index);
        //toUpperCase   
        let upper=firstname.toUpperCase();
        console.log(upper);
        //toLowerCase
        let lower=lastname.toLowerCase();
        console.log(lower);
        

        </script>
    
</body>
</html>
