<head>

<body>
    <script>
        let marks=90;
        if(marks>=80)
        {
            console.log("A+");
        }else if(marks>=60)
        {
            console.log("B");
        }
        else if(marks>=40)
        {
            console.log("C");
        }else{
            console.log("Fail");
        }
    </script>
    
</body>
